name: Keep backend awake

# Render's free tier spins the backend down after ~15 minutes with no
# traffic and takes 30-60s to wake back up on the next request. This just
# visits the live URL often enough that it never gets the chance to sleep -
# purely a keep-alive ping, doesn't touch the app or its data.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS https://samsung-india-backend.onrender.com/ || echo "Ping failed - backend may still be waking up, next scheduled run will retry."
